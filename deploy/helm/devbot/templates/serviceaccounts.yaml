{{- /* One ServiceAccount per role, for its job pods alone: what EKS binds to
it (an IRSA role, a Pod Identity association) reaches that role's model
proxy and nothing else. */ -}}
{{- range $kind := list "implement" "review" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Release.Name }}-{{ $kind }}
  labels: {{- include "devbot.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $kind }}
  {{- with dig "serviceAccount" "annotations" dict (index $.Values.jobs $kind) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
---
# serve's own: with pod_labels or services, the only identity in the
# install with API access, so the job pods need none.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-serve
  labels: {{- include "devbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: serve
automountServiceAccountToken: false
{{- $labelPods := eq (include "devbot.podLabels" .) "true" }}
{{- $services := eq (include "devbot.services" .) "true" }}
{{- $servicePolicies := and $services .Values.networkPolicy.enabled }}
{{- if $services }}
---
# The service pods' (services): no API token, and nothing bound to it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-services
  labels: {{- include "devbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: services
automountServiceAccountToken: false
{{- end }}
{{- if or $labelPods $services }}
---
# Reading and labelling the job pods: KEDA can't label a pod with the job it
# goes on to take, so serve does (docs/operating.md#cost-and-usage-reporting).
# And with services, creating each run's service pod and NetworkPolicy, and
# listing and deleting them once the run is over
# (docs/operating.md#service-containers). resourceNames can't narrow this:
# KEDA's Jobs name their pods as they start them, and a rule names pods
# exactly, never by prefix or label. So the Role reaches every pod in the
# namespace, and the admission policies below hold serve to devbot's own
# metadata on this release's job pods and to this release's service pods.
# Serve lists only service pods, by label, and never watches.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-serve
  labels: {{- include "devbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: serve
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get{{ if $labelPods }}, patch{{ end }}{{ if $services }}, list, create, delete{{ end }}]
  {{- if $servicePolicies }}
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [list, create, delete]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-serve
  labels: {{- include "devbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: serve
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-serve
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-serve
    namespace: {{ .Release.Namespace }}
{{- /* Against a cluster, helm knows every kind it serves; without one (helm
template, helm lint) it knows no kinds at all, v1/Pod included. Rendered
offline the policy is always in, and applying it fails on a cluster that
lacks the API. */}}
{{- $vap := .Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy" }}
{{- $offline := not (.Capabilities.APIVersions.Has "v1/Pod") }}
{{- $unrestricted := .Values.podLabels.allowUnrestrictedPatch }}
{{- if and $labelPods (not $vap) (not $offline) (not $unrestricted) }}
{{- fail (printf "podLabels.enabled: this cluster doesn't serve admissionregistration.k8s.io/v1 ValidatingAdmissionPolicy (Kubernetes 1.30 and later, unless turned off), which is what holds serve's pod patches to devbot's own labels on devbot's job pods. Without it serve's Role lets it patch any pod in namespace %s, image included, so whoever takes over serve can run their code in any of them. Turn the API on, set podLabels.enabled false, or set podLabels.allowUnrestrictedPatch true to accept that" .Release.Namespace) }}
{{- end }}
{{- if and $services (not $vap) (not $offline) }}
{{- fail (printf "services.enabled: this cluster doesn't serve admissionregistration.k8s.io/v1 ValidatingAdmissionPolicy (Kubernetes 1.30 and later, unless turned off), which is what holds serve to creating service pods of devbot's shape. Without it serve's Role lets it create any pod in namespace %s, privileged or with any ServiceAccount, so whoever takes over serve could take over the namespace. Turn the API on, or set services.enabled false" .Release.Namespace) }}
{{- end }}
{{- if or $vap (and $offline (or (not $unrestricted) $services)) }}
{{- $name := printf "%s-%s-serve-pods" .Release.Namespace .Release.Name }}
{{- $images := dig "repos" "limits" "services" "images" list .Values.config }}
{{- $pullSecrets := hasKey (.Values.config.services | default dict) "image_pull_secrets" | ternary (dig "services" "image_pull_secrets" list .Values.config) (include "devbot.pullSecretNames" . | fromYamlArray) | default list }}
---
# All serve's ServiceAccount may do to pods: change devbot.io/ and
# labels.devbot.io/ labels and annotations on this release's job pods, and
# with services, create and delete this release's service pods, shaped as
# devbot makes them. A patch can change a container's image, and a pod can
# run anything as anyone, so the Role alone would let serve run any code in
# any pod in the namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels: {{- include "devbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: serve
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE, CONNECT]
        resources: [pods, pods/*]
  matchConditions:
    - name: serve
      expression: request.userInfo.username == {{ printf "system:serviceaccount:%s:%s-serve" .Release.Namespace .Release.Name | quote }}
  variables:
    - name: update
      expression: request.operation == "UPDATE" && (!has(request.subResource) || request.subResource == "")
    - name: oldLabels
      expression: "has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}"
    - name: newLabels
      expression: "has(object.metadata.labels) ? object.metadata.labels : {}"
    - name: oldAnnotations
      expression: "has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}"
    - name: newAnnotations
      expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}"
    {{- if $services }}
    - name: create
      expression: request.operation == "CREATE" && (!has(request.subResource) || request.subResource == "")
    - name: delete
      expression: request.operation == "DELETE" && (!has(request.subResource) || request.subResource == "")
    - name: servicePod
      expression: >-
        variables.create && "app.kubernetes.io/instance" in variables.newLabels && variables.newLabels["app.kubernetes.io/instance"] == {{ .Release.Name | quote }} &&
        "app.kubernetes.io/component" in variables.newLabels && variables.newLabels["app.kubernetes.io/component"] == "services" && "devbot.io/run" in variables.newLabels ||
        variables.delete && "app.kubernetes.io/instance" in variables.oldLabels && variables.oldLabels["app.kubernetes.io/instance"] == {{ .Release.Name | quote }} &&
        "app.kubernetes.io/component" in variables.oldLabels && variables.oldLabels["app.kubernetes.io/component"] == "services" && "devbot.io/run" in variables.oldLabels
    {{- end }}
  # Each but the first holds for anything else, so that one alone says why.
  validations:
    {{- if $services }}
    - expression: variables.update || variables.servicePod
      message: serve may only patch a pod itself, or create and delete {{ .Release.Name }}'s service pods; not exec into one or change a subresource
      reason: Forbidden
    {{- else }}
    - expression: variables.update
      message: serve may only patch a pod itself, not create, delete or exec into one or change a subresource
      reason: Forbidden
    {{- end }}
    - expression: >-
        !variables.update ||
        "app.kubernetes.io/instance" in variables.oldLabels && variables.oldLabels["app.kubernetes.io/instance"] == {{ .Release.Name | quote }} &&
        "app.kubernetes.io/component" in variables.oldLabels && variables.oldLabels["app.kubernetes.io/component"] in ["implement", "review"]
      message: serve may only patch {{ .Release.Name }}'s implement and review pods
      reason: Forbidden
    - expression: "!variables.update || object.spec == oldObject.spec"
      message: serve may not change a pod's spec
      reason: Forbidden
    # An owner or a finalizer gone would take the pod out of its Job's hands.
    - expression: >-
        !variables.update ||
        has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences) &&
        (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences) &&
        has(object.metadata.finalizers) == has(oldObject.metadata.finalizers) &&
        (!has(object.metadata.finalizers) || object.metadata.finalizers == oldObject.metadata.finalizers)
      message: serve may not change a pod's owners or finalizers
      reason: Forbidden
    - expression: >-
        !variables.update ||
        variables.oldLabels.all(k, k.startsWith("devbot.io/") || k.startsWith("labels.devbot.io/") || (k in variables.newLabels && variables.newLabels[k] == variables.oldLabels[k])) &&
        variables.newLabels.all(k, k.startsWith("devbot.io/") || k.startsWith("labels.devbot.io/") || k in variables.oldLabels)
      message: serve may only set devbot.io/ and labels.devbot.io/ labels
      reason: Forbidden
    - expression: >-
        !variables.update ||
        variables.oldAnnotations.all(k, k.startsWith("devbot.io/") || k.startsWith("labels.devbot.io/") || (k in variables.newAnnotations && variables.newAnnotations[k] == variables.oldAnnotations[k])) &&
        variables.newAnnotations.all(k, k.startsWith("devbot.io/") || k.startsWith("labels.devbot.io/") || k in variables.oldAnnotations)
      message: serve may only set devbot.io/ and labels.devbot.io/ annotations
      reason: Forbidden
    {{- if $services }}
    # A service pod as serve makes one (internal/server/services.go): its
    # run's Job owns it, it has its own ServiceAccount with no token, and
    # nothing of the node's: no host namespaces, no volumes, no privilege.
    - expression: >-
        !variables.create ||
        has(object.metadata.ownerReferences) && size(object.metadata.ownerReferences) == 1 &&
        object.metadata.ownerReferences[0].apiVersion == "batch/v1" && object.metadata.ownerReferences[0].kind == "Job"
      message: a service pod must be owned by its run's Job, and nothing else
      reason: Forbidden
    - expression: >-
        !variables.create ||
        has(object.spec.serviceAccountName) && object.spec.serviceAccountName == {{ printf "%s-services" .Release.Name | quote }} &&
        has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false
      message: a service pod must run as {{ .Release.Name }}-services, with no API token
      reason: Forbidden
    - expression: >-
        !variables.create ||
        !(has(object.spec.hostNetwork) && object.spec.hostNetwork) && !(has(object.spec.hostPID) && object.spec.hostPID) && !(has(object.spec.hostIPC) && object.spec.hostIPC) &&
        (!has(object.spec.volumes) || size(object.spec.volumes) == 0) &&
        (!has(object.spec.initContainers) || size(object.spec.initContainers) == 0) &&
        (!has(object.spec.ephemeralContainers) || size(object.spec.ephemeralContainers) == 0)
      message: a service pod may have no host namespaces, volumes, init or ephemeral containers
      reason: Forbidden
    # The legacy forms of the profiles below. Whether the API server folds
    # them into the fields before this policy reads the pod depends on its
    # version, and serve sets none, so none is let through.
    - expression: >-
        !variables.create || variables.newAnnotations.all(k, !k.contains("apparmor") && !k.contains("seccomp"))
      message: a service pod may not have AppArmor or seccomp annotations
      reason: Forbidden
    - expression: >-
        !variables.create ||
        has(object.spec.securityContext) && has(object.spec.securityContext.seccompProfile) && object.spec.securityContext.seccompProfile.type == "RuntimeDefault" &&
        object.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false &&
          !(has(c.securityContext.privileged) && c.securityContext.privileged) &&
          !(has(c.securityContext.capabilities) && has(c.securityContext.capabilities.add) && size(c.securityContext.capabilities.add) > 0) &&
          (!has(c.volumeMounts) || size(c.volumeMounts) == 0))
      message: a service pod's containers must run with the RuntimeDefault seccomp profile, no privilege, no added capabilities and no mounts
      reason: Forbidden
    # A container's own profile overrides the pod's, and an SELinux type
    # can lift confinement as surely as Unconfined does.
    - expression: >-
        !variables.create ||
        (!has(object.spec.securityContext) ||
          !(has(object.spec.securityContext.appArmorProfile) && object.spec.securityContext.appArmorProfile.type == "Unconfined") &&
          !has(object.spec.securityContext.seLinuxOptions) &&
          (!has(object.spec.securityContext.sysctls) || size(object.spec.securityContext.sysctls) == 0)) &&
        object.spec.containers.all(c, !has(c.securityContext) ||
          !(has(c.securityContext.seccompProfile) && c.securityContext.seccompProfile.type != "RuntimeDefault") &&
          !(has(c.securityContext.appArmorProfile) && c.securityContext.appArmorProfile.type == "Unconfined") &&
          !has(c.securityContext.seLinuxOptions) &&
          !(has(c.securityContext.procMount) && c.securityContext.procMount != "Default"))
      message: a service pod may not loosen seccomp, AppArmor, SELinux, sysctls or /proc for itself or a container
      reason: Forbidden
    # serve only writes literal values. A reference to a Secret or a
    # ConfigMap would land in the container, and back out to serve through
    # its termination message (FallbackToLogsOnError, and serve can read
    # pods): a way to read every Secret in the namespace. Pull secrets
    # reach only the kubelet, but are the install's alone to name, so serve
    # can't put any other Secret in front of a registry it controls.
    - expression: >-
        !variables.create ||
        (!has(object.spec.imagePullSecrets) || object.spec.imagePullSecrets.all(s, has(s.name) && s.name in {{ $pullSecrets | toJson }})) &&
        object.spec.containers.all(c, !has(c.envFrom) && (!has(c.env) || c.env.all(e, !has(e.valueFrom))))
      message: a service pod's env may only hold literal values, with no Secret, ConfigMap or field references, and its only image pull Secrets those the install configures
      reason: Forbidden
    # Nothing that reaches past the pod's own network: a host port binds on
    # the node and gets round the run's NetworkPolicy, and the kubelet makes
    # HTTP, gRPC and remote-host probes and hooks from the node.
    - expression: >-
        !variables.create ||
        object.spec.containers.all(c,
          (!has(c.ports) || c.ports.all(p, (!has(p.hostPort) || p.hostPort == 0) && !has(p.hostIP))) &&
          !has(c.lifecycle) && !has(c.livenessProbe) && !has(c.startupProbe) &&
          (!has(c.readinessProbe) || !has(c.readinessProbe.httpGet) && !has(c.readinessProbe.grpc) &&
            !(has(c.readinessProbe.tcpSocket) && has(c.readinessProbe.tcpSocket.host))))
      message: a service pod may have no host ports, lifecycle hooks or liveness/startup probes, and only exec or local TCP readiness probes
      reason: Forbidden
    # Placement and priority are the install's: serve sets neither a node
    # nor a priority class, and doesn't claim devices.
    - expression: >-
        !variables.create ||
        !has(object.spec.nodeName) && !has(object.spec.priorityClassName) &&
        (!has(object.spec.resourceClaims) || size(object.spec.resourceClaims) == 0)
      message: a service pod may not pick its node or priority class, or claim devices
      reason: Forbidden
    # Every container bounded, so a service can't starve the job pods on
    # its node: serve always sets these.
    - expression: >-
        !variables.create ||
        object.spec.containers.all(c, has(c.resources) && has(c.resources.limits) &&
          ["cpu", "memory", "ephemeral-storage"].all(r, r in c.resources.limits))
      message: a service pod's containers must have CPU, memory and ephemeral-storage limits
      reason: Forbidden
    {{- if .Values.jobs.userNamespaces }}
    - expression: "!variables.create || has(object.spec.hostUsers) && object.spec.hostUsers == false"
      message: a service pod must run in a user namespace (hostUsers false), as job pods do
      reason: Forbidden
    {{- end }}
    {{- with .Values.jobs.runtimeClassName }}
    - expression: >-
        !variables.create || has(object.spec.runtimeClassName) && object.spec.runtimeClassName == {{ . | quote }}
      message: a service pod must run with RuntimeClass {{ . }}, as job pods do
      reason: Forbidden
    {{- end }}
    {{- if not (has "*" $images) }}
    {{- range $images }}
    {{- if not (and (contains "/" .) (or (hasSuffix "/" .) (hasSuffix ":" .) (hasSuffix "@" .) (contains "@" .) (contains ":" (last (splitList "/" .))))) }}
    {{- fail (printf "config.repos.limits.services.images: %q also matches %s-other/...: end a prefix with /, : or @ (like %s/), or name one image with its tag or digest" . . .) }}
    {{- end }}
    {{- end }}
    # The install's allow-list again, so serve can't be made to pull
    # anything else: an image an entry names exactly, or one under an entry
    # ending in /, : or @. "*" alone allows every image, so has no rule.
    - expression: >-
        !variables.create ||
        object.spec.containers.all(c, {{ $images | toJson }}.exists(p, c.image == p || (p.endsWith("/") || p.endsWith(":") || p.endsWith("@")) && c.image.startsWith(p)))
      message: a service pod may only run images config.repos.limits.services.images allows
      reason: Forbidden
    {{- else if gt (len $images) 1 }}
    {{- fail "config.repos.limits.services.images: \"*\" allows every image, so list it alone" }}
    {{- end }}
    {{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels: {{- include "devbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: serve
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
{{- if $services }}
{{- $placement := printf "%s-%s-serve-placement" .Release.Namespace .Release.Name }}
{{- $rc := .Values.jobs.runtimeClassName }}
---
# And a service pod runs where job pods do (serve copies jobs.nodeSelector,
# tolerations and affinity) and nowhere else: a toleration, an affinity or a
# scheduler of its own could put it on the control plane or any other node
# kept apart. Admission adds to what serve sent: the API server the
# not-ready and unreachable tolerations every pod gets
# (DefaultTolerationSeconds), and with jobs.runtimeClassName the RuntimeClass
# plugin its scheduling.nodeSelector and tolerations, before any policy
# runs. That RuntimeClass is this policy's param, so it allows exactly those
# on top. Only serve's creates of service pods are matched (the policy above
# refuses it any other pod, and says so), so a RuntimeClass that's gone stops
# nothing but service pods, which couldn't start without it anyway.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $placement }}
  labels: {{- include "devbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: serve
spec:
  failurePolicy: Fail
  {{- if $rc }}
  paramKind:
    apiVersion: node.k8s.io/v1
    kind: RuntimeClass
  {{- end }}
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE]
        resources: [pods]
  matchConditions:
    - name: serve
      expression: request.userInfo.username == {{ printf "system:serviceaccount:%s:%s-serve" .Release.Namespace .Release.Name | quote }}
    - name: servicePod
      expression: >-
        has(object.metadata.labels) && "app.kubernetes.io/instance" in object.metadata.labels && object.metadata.labels["app.kubernetes.io/instance"] == {{ .Release.Name | quote }} &&
        "app.kubernetes.io/component" in object.metadata.labels && object.metadata.labels["app.kubernetes.io/component"] == "services" && "devbot.io/run" in object.metadata.labels
  variables:
    - name: nodeSelector
      expression: "has(object.spec.nodeSelector) ? object.spec.nodeSelector : {}"
    - name: jobsNodeSelector
      expression: {{ .Values.jobs.nodeSelector | default dict | toJson | quote }}
    {{- if $rc }}
    - name: rcNodeSelector
      expression: "has(params.scheduling) && has(params.scheduling.nodeSelector) ? params.scheduling.nodeSelector : {}"
    - name: rcTolerations
      expression: "has(params.scheduling) && has(params.scheduling.tolerations) ? params.scheduling.tolerations : []"
    {{- end }}
  validations:
    - expression: >-
        variables.nodeSelector.all(k, k in variables.jobsNodeSelector && variables.nodeSelector[k] == variables.jobsNodeSelector[k]{{ if $rc }} ||
          k in variables.rcNodeSelector && variables.nodeSelector[k] == variables.rcNodeSelector[k]{{ end }}) &&
        variables.jobsNodeSelector.all(k, k in variables.nodeSelector){{ if $rc }} && variables.rcNodeSelector.all(k, k in variables.nodeSelector){{ end }} &&
        (!has(object.spec.tolerations) || object.spec.tolerations.all(t, {{ include "devbot.cel" (.Values.jobs.tolerations | default list) }}.exists(j, dyn(t) == j) ||
          {{- if $rc }}
          variables.rcTolerations.exists(r, t == r) ||
          {{- end }}
          has(t.key) && t.key in ["node.kubernetes.io/not-ready", "node.kubernetes.io/unreachable"] &&
          has(t.operator) && t.operator == "Exists" && has(t.effect) && t.effect == "NoExecute" && !has(t.value))) &&
        {{- with .Values.jobs.affinity }}
        has(object.spec.affinity) && dyn(object.spec.affinity) == {{ include "devbot.cel" . }} &&
        {{- else }}
        !has(object.spec.affinity) &&
        {{- end }}
        (!has(object.spec.schedulerName) || object.spec.schedulerName == "default-scheduler")
      message: a service pod must have the job pods' nodeSelector, tolerations and affinity{{ if $rc }} (and RuntimeClass {{ $rc }}'s scheduling){{ end }}, and the default scheduler
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $placement }}
  labels: {{- include "devbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: serve
spec:
  policyName: {{ $placement }}
  {{- with $rc }}
  paramRef:
    name: {{ . }}
    parameterNotFoundAction: Deny
  {{- end }}
  validationActions: [Deny]
{{- end }}
{{- end }}
{{- if $servicePolicies }}
{{- $npName := printf "%s-%s-serve-networkpolicies" .Release.Namespace .Release.Name }}
---
# All serve's ServiceAccount may do to NetworkPolicies: create and delete
# the ones that admit each run's job pod to its service pod. They only
# select this release's service pods and only allow ingress, so serve can't
# open anything else in the namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $npName }}
  labels: {{- include "devbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: serve
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [networking.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [networkpolicies]
  matchConditions:
    - name: serve
      expression: request.userInfo.username == {{ printf "system:serviceaccount:%s:%s-serve" .Release.Namespace .Release.Name | quote }}
  variables:
    - name: target
      expression: 'request.operation == "DELETE" ? oldObject : object'
    - name: labels
      expression: "has(variables.target.metadata.labels) ? variables.target.metadata.labels : {}"
    - name: selects
      expression: "has(object.spec.podSelector.matchLabels) ? object.spec.podSelector.matchLabels : {}"
  validations:
    - expression: >-
        request.operation in ["CREATE", "DELETE"] &&
        "app.kubernetes.io/instance" in variables.labels && variables.labels["app.kubernetes.io/instance"] == {{ .Release.Name | quote }} &&
        "app.kubernetes.io/component" in variables.labels && variables.labels["app.kubernetes.io/component"] == "services" &&
        "devbot.io/run" in variables.labels
      message: serve may only create and delete {{ .Release.Name }}'s service NetworkPolicies
      reason: Forbidden
    - expression: >-
        request.operation != "CREATE" ||
        "app.kubernetes.io/instance" in variables.selects && variables.selects["app.kubernetes.io/instance"] == {{ .Release.Name | quote }} &&
        "app.kubernetes.io/component" in variables.selects && variables.selects["app.kubernetes.io/component"] == "services" &&
        "devbot.io/run" in variables.selects &&
        object.spec.policyTypes == ["Ingress"] && (!has(object.spec.egress) || size(object.spec.egress) == 0)
      message: a service NetworkPolicy may only select one run's service pod, and only allow ingress
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $npName }}
  labels: {{- include "devbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: serve
spec:
  policyName: {{ $npName }}
  validationActions: [Deny]
{{- end }}
{{- end }}
