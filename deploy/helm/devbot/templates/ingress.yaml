{{- with .Values.ingress }}
{{- if .enabled }}
{{- if not .host }}{{ fail "ingress.host: with ingress.enabled, the public hostname serve is reached at, which the forge's webhooks and OAuth's redirect URI name" }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Release.Name }}
  labels: {{- include "devbot.labels" $ | nindent 4 }}
    app.kubernetes.io/component: serve
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .tls.secretName }}
  tls:
    - { hosts: [{{ $.Values.ingress.host | quote }}], secretName: {{ . }} }
  {{- end }}
  rules:
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ $.Release.Name }}, port: { name: http } }
{{- end }}
{{- end }}
