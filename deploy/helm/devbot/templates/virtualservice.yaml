{{- if .Values.virtualService.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "devbot.labels" . | nindent 4 }}
spec:
  hosts: [{{ .Values.virtualService.host | quote }}]
  gateways: [{{ .Values.virtualService.gateway }}]
  http:
    - match:
        - uri: { prefix: {{ .Values.virtualService.prefix | quote }} }
      rewrite: { uri: / }
      route:
        - destination:
            host: {{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local
            port: { number: 80 }
{{- end }}
